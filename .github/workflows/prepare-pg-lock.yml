name: Prepare PostgreSQL dependency lock
on:
  push:
    branches: [feature/persistent-custom-commands]
    paths:
      - '.github/workflows/prepare-pg-lock.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/persistent-custom-commands
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update dependency and lockfile
        run: npm install pg@^8 --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || (git commit -m "Lock PostgreSQL dependency" && git push)
